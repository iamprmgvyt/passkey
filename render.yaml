services:
  - type: web
    name: passkey-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_PREFIX
        value: .
      - key: DASHBOARD_PORT
        value: 10000
